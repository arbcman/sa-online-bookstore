<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book catalogue · SA Online Bookstore</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="catalog">

  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app-header"></div>

  <main id="main" class="page">
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Book catalogue</h1>
          <p class="muted">Search by title or author, or filter by genre.</p>
        </div>
        <a class="btn btn--ghost" href="Index.html">← Back home</a>
      </div>

      <div class="toolbar">
        <div class="search-field">
          <label class="hidden" for="catalog-q">Search books</label>
          <input type="search" id="catalog-q" placeholder="Search title or author…" autocomplete="off">
        </div>
        <label class="hidden" for="catalog-genre">Filter by genre</label>
        <select id="catalog-genre">
          <option value="">All genres</option>
        </select>
      </div>

      <p class="result-line" id="result-line"></p>
      <div class="book-grid" id="catalog-grid"></div>
      <div id="catalog-empty"></div>
    </div>
  </main>

  <div id="app-footer"></div>
  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/pages/catalog.js"></script>
</body>
</html>
