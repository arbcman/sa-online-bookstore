<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage books · SA Online Bookstore</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="admin-books" data-guard="admin">

  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app-header"></div>

  <main id="main" class="page">
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Manage books</h1>
          <p class="muted" id="books-subtitle">Add, edit or remove titles from the catalogue.</p>
        </div>
        <a class="btn btn--primary" href="Book_details.html">+ Add book</a>
      </div>

      <div class="toolbar">
        <div class="search-field">
          <label class="hidden" for="books-search">Search books</label>
          <input type="search" id="books-search" placeholder="Search title, author or ISBN…" autocomplete="off">
        </div>
      </div>

      <div id="books-root"></div>
    </div>
  </main>

  <div id="app-footer"></div>
  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/pages/admin-books.js"></script>
</body>
</html>
